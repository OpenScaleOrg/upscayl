name: Auto Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Bumps package.json/package-lock.json, commits, and tags "vX.Y.Z".
      - name: Bump version and tag
        run: "npm version patch -m 'chore(release): v%s'"

      - name: Push version bump and tag
        run: git push --follow-tags

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's anti-recursion rule), so the "vX.Y.Z" tag just
      # pushed would never fire main.yml's `push: tags` trigger on its own.
      # workflow_dispatch is exempt from that rule, so trigger it directly.
      - name: Trigger release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml --ref main
