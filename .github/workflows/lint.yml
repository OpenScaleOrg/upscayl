name: Lint & Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Typecheck and unit tests are the hard gates — they must pass.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Lint & format are advisory during incremental adoption: the pre-commit
      # hook (lint-staged) enforces them on changed files, so legacy debt in
      # untouched files does not block CI.
      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: Prettier check
        run: npm run format:check
        continue-on-error: true
